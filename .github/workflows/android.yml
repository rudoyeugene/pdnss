name: Do Release
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and Deploy APK into Releases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow execution of gradlew
        run: chmod +x gradlew

      - name: Build PDNSS APK
        id: build_apk
        run: ./gradlew assembleDebug

      - name: Upload PDNSS APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Get PDNSS version
        id: get_version
        run: |
          APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle | head -n1 | cut -d '"' -f2)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(grep 'versionName' app/build.gradle | head -n1 | cut -d '"' -f2)
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.get_version.outputs.APP_VERSION }}
          APK_SRC: app/build/outputs/apk/debug/app-debug.apk
          APK_DST: com.rudyii.pdnss_v${{ steps.get_version.outputs.APP_VERSION }}.apk
        run: |
          cp "$APK_SRC" "$APK_DST"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_DST" --clobber
          else
            gh release create "$TAG" "$APK_DST" --title "$TAG" --generate-notes
          fi